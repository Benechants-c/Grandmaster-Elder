<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRANDMASTER - Real Movie Maker</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:15px;text-align:center}
input,textarea{width:95%;padding:12px;margin:8px 0;border-radius:10px;border:0;font-size:16px}
button{background:#FFD700;color:#000;padding:14px 20px;border:0;border-radius:12px;font-weight:bold;font-size:16px;margin:6px;width:95%}
canvas{width:100%;max-width:640px;border-radius:12px;background:#000}
img{width:100%;max-width:640px;border-radius:12px}
#status{color:#FFD700;margin:10px}
</style>
</head>
<body>
<h2>🎬 GRANDMASTER ELDER<br>Real Movie Maker</h2>
<p>1. Write scene &nbsp; 2. Generate Photo &nbsp; 3. Animate to Video</p>

<textarea id="prompt" rows="3">Elder in Goma disaster, volcano erupting, buildings burning, cinematic realistic movie still</textarea>
<button onclick="genImage()">1. GENERATE REAL PHOTO</button>
<p id="status">Ready...</p>
<img id="photo" style="display:none">
<canvas id="canvas" width="1280" height="720" style="display:none"></canvas>
<br>
<button onclick="previewMotion()">2. PREVIEW MOTION</button>
<button onclick="exportVideo()">3. EXPORT REAL VIDEO FILE</button>
<video id="result" controls style="display:none;width:100%;max-width:640px;margin-top:10px"></video>
<a id="download" style="display:none"><button>DOWNLOAD VIDEO</button></a>

<script>
let img = new Image();
img.crossOrigin = "anonymous";
let animId;
let isRecording = false;

function genImage(){
  let p = document.getElementById('prompt').value;
  document.getElementById('status').innerText = "Generating real photo... wait 10-20s";
  let url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p + ", cinematic, realistic, 1080p movie still") + "?width=1280&height=720&seed=" + Math.floor(Math.random()*99999) + "&nologo=true";
  img.onload = ()=>{
    document.getElementById('photo').src = url;
    document.getElementById('photo').style.display = "block";
    document.getElementById('status').innerText = "✅ Photo generated! Now tap Preview Motion";
  };
  img.onerror = ()=>{ document.getElementById('status').innerText = "Network slow, tap Generate again"; };
  img.src = url;
}

function drawFrame(t){
  let canvas = document.getElementById('canvas');
  let ctx = canvas.getContext('2d');
  canvas.style.display = "block";
  // Ken Burns: slow zoom in + slight pan = movie camera movement
  let zoom = 1.0 + (t * 0.00008); // slow zoom
  let w = 1280 * zoom;
  let h = 720 * zoom;
  let x = (1280 - w)/2 + Math.sin(t*0.0002)*20;
  let y = (720 - h)/2;
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,1280,720);
  if(img.complete && img.naturalWidth>0){
    ctx.drawImage(img, x, y, w, h);
  }
  // Subtitle / cinematic bars
  ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0,0,1280,60); ctx.fillRect(0,660,1280,60);
  ctx.fillStyle = "#fff"; ctx.font = "bold 32px Arial"; ctx.textAlign = "center";
  ctx.fillText(document.getElementById('prompt').value.substring(0,60), 640, 700);
  // Shake for disaster feel
  if(Math.random()>0.97){ ctx.translate(Math.random()*4, Math.random()*4); }
}

function previewMotion(){
  if(!img.src){ alert("Generate photo first"); return; }
  document.getElementById('status').innerText = "▶️ Previewing motion - this is how your video will look";
  cancelAnimationFrame(animId);
  let start = performance.now();
  function loop(now){ drawFrame(now-start); animId = requestAnimationFrame(loop); }
  animId = requestAnimationFrame(loop);
}

function exportVideo(){
  if(!img.src){ alert("Generate photo first"); return; }
  cancelAnimationFrame(animId);
  document.getElementById('status').innerText = "🔴 RECORDING REAL VIDEO... 10 seconds, don't close";
  let canvas = document.getElementById('canvas');
  canvas.style.display = "block";
  let stream = canvas.captureStream(30);
  let chunks = [];
  let rec = new MediaRecorder(stream, {mimeType:'video/webm'});
  rec.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
  rec.onstop = ()=>{
    let blob = new Blob(chunks, {type:'video/webm'});
    let url = URL.createObjectURL(blob);
    let v = document.getElementById('result');
    v.src = url; v.style.display = "block";
    let a = document.getElementById('download');
    a.href = url; a.download = "Grandmaster-Elder-Goma.mp4"; a.style.display = "block";
    document.getElementById('status').innerText = "✅ DONE! Real video file created. Tap DOWNLOAD VIDEO";
  };
  rec.start();
  let start = performance.now();
  function loop(now){ drawFrame(now-start); if(now-start < 10000){ animId = requestAnimationFrame(loop); } else { rec.stop(); cancelAnimationFrame(animId); } }
  animId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
